name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you press "Run workflow" manually

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK components
        working-directory: SodiumStudio
        run: >
          dotnet build -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory=$HOME/android-sdk -p:AcceptAndroidSDKLicenses=True

      - name: Publish APK (Release)
        working-directory: SodiumStudio
        run: >
          dotnet publish -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64
          -p:AndroidSdkDirectory=$HOME/android-sdk

      - name: Collect APK
        run: |
          mkdir -p out
          find SodiumStudio/bin -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: SodiumStudio-apk
          path: out/*.apk
          if-no-files-found: error
